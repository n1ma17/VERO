services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_money
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_money']
      interval: 5s
      timeout: 5s
      retries: 12
    # Host 5432 often conflicts with a local Postgres install — use 5433 if you need psql from the host.
    ports:
      - '${POSTGRES_PUBLISH_PORT:-5433}:5432'

  backend:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app_money
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-false}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      ARCJET_ENV: ${ARCJET_ENV:-development}
      ARCJET_MODE: ${ARCJET_MODE:-DRY_RUN}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
    depends_on:
      db:
        condition: service_healthy
    # Optional direct API access (UI goes through frontend nginx on :8080)
    ports:
      - '${BACKEND_PUBLISH_PORT:-3000}:3000'

  frontend:
    build:
      context: .
      dockerfile: front-end/Dockerfile
    restart: unless-stopped
    ports:
      - '${FRONTEND_PUBLISH_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  postgres_data:
